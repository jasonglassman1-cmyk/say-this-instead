<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Say This Instead</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0e;
  --surface: #161616;
  --surface2: #1e1e1e;
  --border: #2a2a2a;
  --text: #f0ede6;
  --text-dim: #888;
  --text-dimmer: #555;
  --accent: #d4a84b;
  --accent-dim: rgba(212,168,75,0.12);
  --red: #c0392b;
  --green: #27ae60;

  --cat-presence: #4a90d9;
  --cat-ownership: #9b59b6;
  --cat-confidence: #27ae60;
  --cat-escalate: #e67e22;
  --cat-ground: #c0392b;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ── Header ── */
header {
  padding: 28px 32px 0;
  display: flex;
  align-items: baseline;
  gap: 16px;
}
.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: var(--text);
  letter-spacing: -0.02em;
}
.logo span { color: var(--accent); font-style: italic; }
.deck-count {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--text-dimmer);
  letter-spacing: 0.08em;
}

/* ── Filters ── */
.filters {
  padding: 20px 32px 0;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.filter-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.18s;
  white-space: nowrap;
}
.filter-btn:hover { border-color: var(--text-dim); color: var(--text); }
.filter-btn.active {
  color: var(--bg);
  border-color: transparent;
  font-weight: 500;
}
.filter-btn[data-cat="all"].active { background: var(--text); }
.filter-btn[data-cat="presence"].active { background: var(--cat-presence); }
.filter-btn[data-cat="ownership"].active { background: var(--cat-ownership); }
.filter-btn[data-cat="confidence"].active { background: var(--cat-confidence); }
.filter-btn[data-cat="escalate"].active { background: var(--cat-escalate); }
.filter-btn[data-cat="ground"].active { background: var(--cat-ground); }

/* ── Stage ── */
.stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  min-height: 420px;
}

/* ── Card ── */
.card-wrap {
  width: 100%;
  max-width: 560px;
  perspective: 1200px;
  cursor: pointer;
}
.card {
  width: 100%;
  min-height: 320px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
}
.card.flipped { transform: rotateY(180deg); }

.card-face {
  position: absolute;
  width: 100%;
  min-height: 320px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 16px;
  border: 1px solid var(--border);
  overflow: hidden;
}

/* Front */
.card-front {
  background: var(--surface);
  display: flex;
  flex-direction: column;
}
.card-front-top {
  padding: 24px 28px 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.card-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dimmer);
  margin-bottom: 14px;
}
.card-main-text {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(18px, 4vw, 26px);
  line-height: 1.4;
  color: var(--text);
  flex: 1;
}
.card-front-bottom {
  padding: 14px 28px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cat-tag {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.05em;
  padding: 3px 10px;
  border-radius: 20px;
  text-transform: uppercase;
}
.cat-presence { background: rgba(74,144,217,0.15); color: var(--cat-presence); }
.cat-ownership { background: rgba(155,89,182,0.15); color: var(--cat-ownership); }
.cat-confidence { background: rgba(39,174,96,0.15); color: var(--cat-confidence); }
.cat-escalate { background: rgba(230,126,34,0.15); color: var(--cat-escalate); }
.cat-ground { background: rgba(192,57,43,0.15); color: var(--cat-ground); }

.flip-hint {
  font-size: 11px;
  color: var(--text-dimmer);
  display: flex;
  align-items: center;
  gap: 5px;
}
.flip-hint svg { opacity: 0.5; }

/* Back */
.card-back {
  background: var(--surface2);
  transform: rotateY(180deg);
  display: flex;
  flex-direction: column;
  min-height: 320px;
}
.card-back-section {
  padding: 20px 28px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.card-back-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-dimmer);
  display: flex;
  align-items: center;
  gap: 5px;
}
.card-back-text {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-dim);
  font-style: italic;
}
.card-back-insight {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
}
.divider-line {
  height: 1px;
  background: var(--border);
  margin: 0 28px;
}

/* ── Nav ── */
.nav {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 24px;
}
.nav-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  font-size: 18px;
}
.nav-btn:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
}
.nav-btn:disabled { opacity: 0.25; cursor: default; }
.nav-counter {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: var(--text-dim);
  min-width: 56px;
  text-align: center;
  letter-spacing: 0.06em;
}

/* ── Progress bar ── */
.progress-track {
  width: 100%;
  max-width: 560px;
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 20px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s ease;
}

/* ── Empty ── */
.empty-state {
  text-align: center;
  color: var(--text-dimmer);
  font-size: 14px;
  padding: 60px 0;
}

/* ── Keyboard hint ── */
.kb-hint {
  text-align: center;
  font-size: 11px;
  color: var(--text-dimmer);
  padding: 0 0 28px;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em;
}
kbd {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 10px;
  font-family: 'DM Mono', monospace;
}

/* ── Mobile ── */
@media (max-width: 480px) {
  header { padding: 20px 20px 0; }
  .filters { padding: 16px 20px 0; }
  .stage { padding: 24px 16px; }
  .card-front-top, .card-back-section { padding: 18px 20px; }
  .card-front-bottom { padding: 12px 20px; }
  .divider-line { margin: 0 20px; }
  .kb-hint { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="logo">Say This <span>Instead</span></div>
  <div class="deck-count" id="deck-label"></div>
</header>

<div class="filters">
  <button class="filter-btn active" data-cat="all" onclick="setFilter('all')">All</button>
  <button class="filter-btn" data-cat="presence" onclick="setFilter('presence')">Meeting presence</button>
  <button class="filter-btn" data-cat="ownership" onclick="setFilter('ownership')">Ownership</button>
  <button class="filter-btn" data-cat="confidence" onclick="setFilter('confidence')">Confidence</button>
  <button class="filter-btn" data-cat="escalate" onclick="setFilter('escalate')">Escalate</button>
  <button class="filter-btn" data-cat="ground" onclick="setFilter('ground')">Hold ground</button>
</div>

<div class="stage">
  <div class="card-wrap" id="card-wrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="card-front-top">
          <div class="card-label">Say this instead</div>
          <div class="card-main-text" id="front-text"></div>
        </div>
        <div class="card-front-bottom">
          <span class="cat-tag" id="front-cat"></span>
          <span class="flip-hint">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6c0-2.21 1.79-4 4-4s4 1.79 4 4-1.79 4-4 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M8.5 2.5L10 4l-1.5 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            flip
          </span>
        </div>
      </div>
      <div class="card-face card-back">
        <div class="card-back-section">
          <div class="card-back-label">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="5" r="3" stroke="#d4a84b" stroke-width="1.2"/><path d="M5.5 8v1.5a1 1 0 002 0V8" stroke="#d4a84b" stroke-width="1.2" stroke-linecap="round"/></svg>
            Insight
          </div>
          <div class="card-back-insight" id="back-insight"></div>
        </div>
        <div class="divider-line"></div>
        <div class="card-back-section" style="flex:0">
          <div class="card-back-label">Said</div>
          <div class="card-back-text" id="back-said"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progress"></div>
  </div>

  <div class="nav">
    <button class="nav-btn" id="btn-prev" onclick="go(-1)" title="Previous">&#8592;</button>
    <div class="nav-counter" id="counter"></div>
    <button class="nav-btn" id="btn-next" onclick="go(1)" title="Next">&#8594;</button>
  </div>
</div>

<div class="kb-hint">
  <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;·&nbsp; <kbd>space</kbd> flip
</div>

<script>
const CARDS = [
  {cat:"presence",after:"Here's what I need your input on today — three items. (Then lead.)",insight:"Arrive at every Mike 1:1 with a doc or agenda you drive. No doc = you don't own the meeting.",before:"I mean, I don't have anything to present. I just have a like a list of going through.",situation:"Arriving at Mike 1:1 without an agenda"},
  {cat:"ownership",after:"The Rama/Brian/Blake conflict is blocking decisions. I need you to clarify who has architectural authority this week — I can't resolve it at my level.",insight:"Never narrate dysfunction as something happening to you. Name it, make the ask, move on.",before:"I've sort of been led to the slaughter.",situation:"Describing the engineering conflict to Mike"},
  {cat:"confidence",after:"We're at 22,174 active merchants, up ~3% MoM. I have an open question on Dec–Jan data integrity I'm resolving with BI.",insight:"Lead with a number. State what you know, then name what you're still validating.",before:"...it just it looked like we were, you know, incrementally on the rise.",situation:"Reporting on product metrics to Mike"},
  {cat:"escalate",after:"This is a Q2 risk. I need a decision on approach by Friday so I can reforecast. I'm flagging it now.",insight:'Every blocker needs a deadline and a specific ask. "Remains to be seen" is not an escalation.',before:"Whether or not that challenges Q2 or not is remains to be seen.",situation:"Mentioning Q2 risk in standup"},
  {cat:"ground",after:"I hear that people are confused — I own the communication gap. My read on why is different. Can I walk you through it?",insight:"Acknowledge the concern. Don't abandon the position. Capitulation is not resolution.",before:"That's simply not possible... [45 seconds later] Okay that's fine, I get it.",situation:"Under pushback from Mike on alignment confusion"},
  {cat:"ownership",after:"Mike, I need you to reset authority among Rama, Brian, and Blake. My recommendation: [X] has final call on architecture. Can you make that explicit?",insight:"Narrating a conflict is not managing it. Bring a recommendation and a specific ask.",before:"...basically them fighting right in front of me... what the fuck are we doing here?",situation:"Describing engineers fighting in front of him"},
  {cat:"escalate",after:"Root cause was missing architecture diagrams. I've made that a hard launch gate starting next sprint. I'll report back after the next release.",insight:"Problem → root cause → fix → checkpoint date. Every time.",before:"So far, I've raised it as a topic for improvements within the retro... although we haven't seen it yet.",situation:"Asked what he's doing about recurring release failures"},
  {cat:"confidence",after:"Transaction source breakdown is more useful for transaction counts than merchant counts — it won't explain the December jump.",insight:"Drop the preamble. State the insight. Let the room respond.",before:"Wait, wait, my, am I thinking about this wrong? Like, like, the fact that so it seems like this subdivision into transaction source is going to be more valuable...",situation:"Proposing a data insight to Mike"},
  {cat:"presence",after:"I run kickoffs for anything this size. Today's goal: make sure everyone understands what we're building, why, and what's open. Let's get into it.",insight:"Owners communicate decisions, not deliberations. The moment you explain why you're doing your job, you've signaled uncertainty about your right to do it.",before:"this is something that I do, or I've been trying to do, for larger projects and initiatives, is to have just a kickoff call so that everyone on the team...",situation:"Opening the Canada Rewards kickoff"},
  {cat:"confidence",after:"Dollar discount and percentage discount — Frank, confirm I have that right. (Don't narrate your own forgetting.)",insight:"Credibility is destroyed fastest by signaling to the room that you're surprised you don't know it. Recover without commentary.",before:"I haven't burned it into my memory. What it is, I think it's price discount and percentage discount. Let me pause there.",situation:"Forgetting reward type names mid-kickoff"},
  {cat:"escalate",after:"I want to flag something: my compliance call got rescheduled. That's the dependency for consent language, unsubscribe flows, and the free-item reward type. Until that's resolved, those items are blocked. If it slips, it becomes a timeline risk.",insight:"A blocker that isn't named as a blocker doesn't get treated as one.",before:"I actually had a call with legal compliance today, which has been rescheduled, but that's just a word of context there.",situation:"Mentioning the postponed compliance call"},
  {cat:"presence",after:"Here's what I need out of today: architecture locked, and a milestone plan from Rama by end of next week — sprint start date, Q target. Can we commit to that before we close?",insight:"Product owns the outcome. Name the decision, pressure-test the timeline, drive to a close.",before:"I just want to confirm that's something the way that we get there is like beginning next week with Card Free.",situation:"Closing an architecture meeting with a confirmation request"},
  {cat:"ownership",after:"The engineering team can't give me a committed date. I've been unable to break the logjam between Rama and Dinesh. I need you to apply pressure with Dolly. Specifically: I need a hard date for Canada by Friday. Can you make that happen?",insight:'"Raising awareness" is not a PM ask — it\'s a status update with a shrug. When you escalate, make the ask explicit.',before:"There isn't any real action item, I think other than raising awareness, basically, you know, I'm looking for commitments from engineering now that we're nearing the end of the quarter.",situation:"Framing the engineering commitment issue to Mike"},
  {cat:"confidence",after:"I don't have that confirmed. My working assumption is yes — data gets lost in the merge. I'll verify with engineering and get you a clear answer before end of day.",insight:"State the assumption, name the gap, commit to closing it. Stop auditing your own reliability out loud.",before:"I'm trying to give you like some, like some usable information, like that. You have to take everything with a grain of salt...",situation:"Answering a question about data loss with audited uncertainty"},
  {cat:"confidence",after:"(Nothing. Submit the goals. If Mike identifies gaps, address them. Don't audit your own work unprompted.)",insight:"Pre-emptive self-criticism is not humility — it's a bid for reassurance. It invites your manager to manage you.",before:"spent, you know, couple hours in one day to over doing that, so it's probably not as broad and deep as it needs to be.",situation:"Introducing the goals doc to Mike"},
  {cat:"ground",after:"Noted — I'll lead with the ask.",insight:"When your manager gives you live feedback, receive it, don't contextualize it. Agreement and adjustment is the move.",before:"I was trying to get David up to speed. [defense in response to live coaching]",situation:"Mike gives live feedback; Jason explains context instead of receiving it"}
];

const CAT_LABELS = {all:"All",presence:"Meeting presence",ownership:"Ownership",confidence:"Confidence",escalate:"Escalate",ground:"Hold ground"};

let deck = [...CARDS];
let idx = 0;
let flipped = false;
let currentFilter = "all";

function setFilter(cat) {
  currentFilter = cat;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  document.querySelector(`[data-cat="${cat}"]`).classList.add("active");
  deck = cat === "all" ? [...CARDS] : CARDS.filter(c => c.cat === cat);
  idx = 0;
  flipped = false;
  document.getElementById("card").classList.remove("flipped");
  render();
}

function flipCard() {
  flipped = !flipped;
  document.getElementById("card").classList.toggle("flipped", flipped);
}

function go(dir) {
  idx = Math.max(0, Math.min(deck.length - 1, idx + dir));
  flipped = false;
  document.getElementById("card").classList.remove("flipped");
  render();
}

function render() {
  if (!deck.length) {
    document.getElementById("card-wrap").style.display = "none";
    document.querySelector(".nav").style.display = "none";
    document.querySelector(".progress-track").style.display = "none";
    document.getElementById("deck-label").textContent = "0 cards";
    return;
  }
  document.getElementById("card-wrap").style.display = "block";
  document.querySelector(".nav").style.display = "flex";
  document.querySelector(".progress-track").style.display = "block";

  const c = deck[idx];
  document.getElementById("front-text").textContent = c.after;
  document.getElementById("back-insight").textContent = c.insight;
  document.getElementById("back-said").textContent = `"${c.before}"`;

  const catEl = document.getElementById("front-cat");
  catEl.textContent = CAT_LABELS[c.cat];
  catEl.className = "cat-tag cat-" + c.cat;

  document.getElementById("counter").textContent = `${idx + 1} / ${deck.length}`;
  document.getElementById("deck-label").textContent = `${deck.length} cards`;
  document.getElementById("progress").style.width = `${((idx + 1) / deck.length) * 100}%`;
  document.getElementById("btn-prev").disabled = idx === 0;
  document.getElementById("btn-next").disabled = idx === deck.length - 1;
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " ") { e.preventDefault(); flipCard(); }
});

render();
</script>
</body>
</html>
